service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    # Request "tốt" = trả lời thành công VÀ nhanh. request_failed tự động là request xấu
    # vì có trong total_event nhưng không có response_sent tương ứng.
    good_event: 'event == "response_sent" and latency_ms <= 2000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  error_budget_examples:
    # error_budget = (1 - 0.995) × tổng request trong cửa sổ 28 ngày
    per_10000_requests: 50       # được phép tối đa 50 request chậm/lỗi
    time_equivalent: 3h22m       # 0.5% × 28 ngày × 24h ≈ 3.36 giờ
  note: >
    Hạ ngưỡng 3000 ms -> 2000 ms dựa trên baseline đo ngày 29/9: P50=153.0 ms,
    P95=4612.0 ms, P99=4612.0 ms, nên 2000 ms vẫn chừa hơn 10 lần headroom. Với 3000 ms, một
    retrieval chậm thêm ~2.5 s (tổng ~2.7 s) vẫn bị tính là "tốt" và SLO không
    phát hiện được. Panel latency trên dashboard vẫn giữ threshold P95 3000 ms
    theo contract config/dashboard.yaml.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
